<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dyslexia Reader — Content Input</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>📖 Dyslexia Reader</h1>
    <p class="subtitle">Get your content ready to be read aloud</p>
  </header>

  <main class="container">
    <nav class="tabs">
      <button class="tab active" data-tab="text-tab">✍️ Type / Paste</button>
      <button class="tab" data-tab="file-tab">📁 Upload File</button>
      <button class="tab" data-tab="ocr-tab">📷 Scan Photo</button>
    </nav>

    <section id="text-tab" class="tab-content active">
      <label for="textInput">Enter or paste your text below:</label>
      <textarea id="textInput" placeholder="Start typing or paste text here..." rows="10"></textarea>
      <div class="char-count"><span id="charCount">0</span> characters</div>
      <div class="btn-row">
        <button id="clearTextBtn" class="btn btn-secondary">🗑️ Clear</button>
        <button id="processTextBtn" class="btn btn-primary">➡️ Process Text</button>
      </div>
    </section>

    <section id="file-tab" class="tab-content">
      <div id="dropZone" class="drop-zone">
        <p>📄 Drag & drop a file here</p>
        <p class="or">— or —</p>
        <label class="btn btn-primary">
          Browse Files
          <input type="file" id="fileInput" hidden accept=".txt,.pdf,.doc,.docx,image/*" />
        </label>
        <p class="hint">Accepted: .txt, .pdf, .doc, .docx, images</p>
      </div>
      <div id="filePreview" class="file-preview hidden">
        <div class="file-info">
          <span id="fileName"></span>
          <span id="fileSize" class="file-size"></span>
        </div>
        <button id="removeFileBtn" class="btn btn-danger">✖ Remove</button>
      </div>
      <div class="btn-row">
        <button id="processFileBtn" class="btn btn-primary" disabled>➡️ Extract & Process</button>
      </div>
    </section>

    <section id="ocr-tab" class="tab-content">
      <div class="ocr-controls">
        <label class="btn btn-primary">
          📷 Choose Photo
          <input type="file" id="imageInput" hidden accept="image/*" />
        </label>
        <button id="cameraBtn" class="btn btn-secondary">🎥 Use Camera</button>
      </div>
      <video id="cameraStream" class="hidden" autoplay playsinline></video>
      <button id="captureBtn" class="btn btn-primary hidden">📸 Capture</button>
      <div id="imagePreviewWrap" class="image-preview hidden">
        <img id="imagePreview" alt="Selected image" />
      </div>
      <div class="btn-row">
        <button id="runOcrBtn" class="btn btn-primary" disabled>🔍 Run OCR</button>
      </div>
      <div id="ocrProgress" class="progress hidden">
        <div class="progress-bar"><div id="progressFill"></div></div>
        <p id="progressText">Initializing OCR...</p>
      </div>
    </section>

    <section id="outputSection" class="output-section hidden">
      <h2>✅ Processed Text</h2>
      <textarea id="processedOutput" rows="8" readonly></textarea>
      <div class="btn-row">
        <button id="copyBtn" class="btn btn-secondary">📋 Copy</button>
        <button id="sendToReaderBtn" class="btn btn-primary">🔊 Send to Reading Engine</button>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script src="js/textCleaner.js"></script>
  <script src="js/textInput.js"></script>
  <script src="js/fileUpload.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
