<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexi - Reading Helper</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="phone">

    <div class="header">
      <h1>Lexi</h1>
    </div>

    <!-- HOME SCREEN: shows passages you've previously typed, uploaded, or scanned -->
    <div class="screen active" id="home">
      <h2>Your Passages</h2>
      <div class="passage-list" id="passageList">
        <!-- script2.js fills this in from localStorage each time the page loads -->
      </div>
    </div>

    <!-- READING SCREEN -->
    <!-- Person 3: text-to-speech controls. Person 2: the "+" panel to add a passage. -->
    <div class="screen" id="reading">
      <div class="reading-controls">
        <button class="btn" onclick="showScreen('home')">Back</button>
        <button class="icon-btn" id="addPassageBtn" title="Add a passage">+</button>
        <button class="icon-btn" id="playPauseBtn" aria-label="Play or pause reading">▶</button>
        <button class="icon-btn" id="stopBtn" aria-label="Stop reading">⏹</button>
        <label for="speedControl">Reading speed</label>
        <select id="speedControl">
          <option value="0.75">Slow</option>
          <option value="1" selected>Normal</option>
          <option value="1.25">Fast</option>
        </select>
        <label for="voiceControl">Voice</label>
        <select id="voiceControl">
          <option value="" selected>Browser default</option>
        </select>
      </div>

      <h2 id="readingTitle">No Passage Selected</h2>

      <!-- ADD-A-PASSAGE PANEL: hidden until the + button is tapped -->
      <div id="addPassagePanel" class="hidden">

        <section id="text-input-section">
          <label for="textInput">Enter or paste text:</label>
          <textarea id="textInput" rows="6" placeholder="Type or paste text here..."></textarea>
          <div class="char-count"><span id="charCount">0</span> characters</div>
          <button id="clearTextBtn">Clear</button>
          <button id="processTextBtn">Add to Reading</button>
        </section>

        <section id="file-upload-section">
          <div id="dropZone">
            <p>Drag & drop a file here, or</p>
            <label>
              Browse Files
              <input type="file" id="fileInput" hidden accept=".txt,.pdf,.doc,.docx,image/*" />
            </label>
            <p>Accepted: .txt, .pdf, .docx, images</p>
          </div>
          <div id="filePreview" class="hidden">
            <span id="fileName"></span>
            <span id="fileSize"></span>
            <button id="removeFileBtn">Remove</button>
          </div>
          <button id="processFileBtn" disabled>Extract & Add</button>
        </section>

        <section id="ocr-section">
          <label>
            Choose Photo
            <input type="file" id="imageInput" hidden accept="image/*" />
          </label>
          <button id="cameraBtn">Use Camera</button>
          <video id="cameraStream" class="hidden" autoplay playsinline></video>
          <button id="captureBtn" class="hidden">Capture</button>
          <div id="imagePreviewWrap" class="hidden">
            <img id="imagePreview" alt="Selected" />
          </div>
          <button id="runOcrBtn" disabled>Scan & Add</button>
          <div id="ocrProgress" class="hidden">
            <div class="progress-bar">
              <div id="progressFill"></div>
            </div>
            <p id="progressText"></p>
          </div>
        </section>

      </div>

      <div class="reading-box">
        <p id="readingText">Tap the + above to type, upload, or scan a passage to read.</p>
      </div>
    </div>

    <!-- SETTINGS SCREEN -->
    <!-- Empty shell only. Person 4 owns the actual controls. -->
    <div class="screen" id="settings">
      <h2>Settings</h2>
      <!-- ACCESSIBILITY SETTINGS -->
      <div class="accessibility-settings">

        <h3>Font</h3>

        <label for="fontSelect">Choose Font:</label>
        <select id="fontSelect">
          <option value="Arial">Arial</option>
          <option value="Verdana">Verdana</option>
          <option value="OpenDyslexic">OpenDyslexic</option>
          <option value="Georgia">Georgia</option>
        </select>

        <h3>Font Size</h3>

        <button id="decreaseFont">A−</button>
        <span id="fontSizeDisplay">18px</span>
        <button id="increaseFont">A+</button>

        <h3>Spacing</h3>

        <div>
          <label for="letterSpacing">Letter Spacing:</label>
          <input type="range" id="letterSpacing" min="0" max="10" value="0">
          <span id="letterSpacingValue">0px</span>
        </div>

        <div>
          <label for="wordSpacing">Word Spacing:</label>
          <input type="range" id="wordSpacing" min="0" max="20" value="0">
          <span id="wordSpacingValue">0px</span>
        </div>

        <div>
          <label for="lineSpacing">Line Spacing:</label>
          <input type="range" id="lineSpacing" min="1" max="3" step="0.1" value="1.5">
          <span id="lineSpacingValue">1.5</span>
        </div>

        <h3>Background & Contrast</h3>

        <label for="backgroundColor">Background:</label>
        <select id="backgroundColor">
          <option value="#ffffff">White</option>
          <option value="#f5f0d8">Cream</option>
          <option value="#dff0ff">Light Blue</option>
          <option value="#eeeeee">Light Gray</option>
        </select>

        <br><br>

        <label for="contrastMode">Contrast:</label>
        <select id="contrastMode">
          <option value="normal">Normal</option>
          <option value="high">High Contrast</option>
        </select>

      </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="nav">
      <button class="active" onclick="showScreen('home')">Home</button>
      <button onclick="showScreen('reading')">Reading</button>
      <button onclick="showScreen('settings')">Settings</button>
    </div>

    <div id="toast" class="toast hidden"></div>

  </div>

  <!-- Third-party libraries used by the + panel (file/OCR extraction) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script src="script.js"></script>

</body>

</html>
